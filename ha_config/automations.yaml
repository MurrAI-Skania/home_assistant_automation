- id: '1768740285938'
  alias: System - Vardagsrum Mysbelysning Logik
  description: 'Hybrid: Blandar XY och RGB för att göra lampan nöjd.'
  triggers:
  - entity_id: input_select.vardagsrum_led_mysbelysning_cykel
