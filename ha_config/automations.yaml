- id: '1769278502631'
  alias: 'AC: Hemma-policy (day/night) + privacy'
  triggers:
  - minutes: /20
    id: tick
    trigger: time_pattern
  - entity_id:
    - input_number.hemma_borvarde_dag
    - input_number.hemma_borvarde_natt
    id: sliders
    trigger: state
  - entity_id: input_select.huslage
    to: Hemma
    id: enter_hemma
    trigger: state
  - at: 06:15:00
    id: boundary_day
    trigger: time
  - at: '20:00:00'
    id: boundary_night
    trigger: time
  - at: '22:00:00'
    id: boundary_weekend_night
    trigger: time
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: Hemma
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''enter_hemma'',''boundary_day'',''boundary_night'',''boundary_weekend_night'']
          }}

          '
      sequence: []
    default:
    - condition: state
      entity_id: input_select.huslage_cooldown
      state: Idle
  - variables:
      wd: '{{ now().weekday() }}'
      t: '{{ now().strftime(''%H:%M:%S'') }}'
      is_weekend: '{{ wd in [4,5] }}'
      is_day: "{% if is_weekend %}\n  {{ '06:15:00' <= t < '22:00:00' }}\n{% else
        %}\n  {{ '06:15:00' <= t < '20:00:00' }}\n{% endif %}\n"
      setpoint: "{% if is_day %}\n  {{ states('input_number.hemma_borvarde_dag') |
        float }}\n{% else %}\n  {{ states('input_number.hemma_borvarde_natt') | float
        }}\n{% endif %}\n"
      temp_sensor: sensor.vardagsrum_kallax_temperature
      min_ac: 16
      max_ac: 28
      climate_entity: climate.sandras_ac
      ac_mode: '{{ state_attr(climate_entity, ''hvac_mode'') or states(climate_entity)
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_hemma'' }}'
      sequence:
      - target:
          entity_id: switch.stugan_cameras
        action: switch.turn_on
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''enter_hemma'',''boundary_day'',''boundary_night'',''boundary_weekend_night'']
          }}

          '
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ac_mode != ''heat'' }}'
          sequence:
          - target:
              entity_id: '{{ climate_entity }}'
            data:
              hvac_mode: heat
            action: climate.set_hvac_mode
          - delay: 00:00:10
      - target:
          entity_id: '{{ climate_entity }}'
        data:
          temperature: '{{ setpoint }}'
        action: climate.set_temperature
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
  - data:
      temp_sensor: '{{ temp_sensor }}'
      setpoint: '{{ setpoint }}'
      min_ac: '{{ min_ac }}'
      max_ac: '{{ max_ac }}'
      climate_entity: '{{ climate_entity }}'
    action: script.temp_reglerare_1_steg_1_c
  mode: single
- id: '1769278860222'
  alias: 'AC: Borta-policy (sovrum) + privacy off'
  triggers:
  - entity_id: input_select.huslage
    to: Borta
    id: enter_borta
    trigger: state
  - minutes: /20
    id: tick
    trigger: time_pattern
  - entity_id: input_number.borta_sovrum_target
    id: slider
    trigger: state
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: Borta
  - condition: state
    entity_id: input_select.huslage_cooldown
    state: Idle
  actions:
  - variables:
      temp_sensor: sensor.sovrum_temperatur
      setpoint: '{{ states(''input_number.borta_sovrum_target'') | float }}'
      min_ac: 16
      max_ac: 20
      climate_entity: climate.sandras_ac
      ac_mode: '{{ state_attr(climate_entity, ''hvac_mode'') or states(climate_entity)
        }}'
  - target:
      entity_id: switch.stugan_cameras
    action: switch.turn_off
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_borta'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ac_mode != ''heat'' }}'
          sequence:
          - target:
              entity_id: '{{ climate_entity }}'
            data:
              hvac_mode: heat
            action: climate.set_hvac_mode
          - delay: 00:00:10
      - target:
          entity_id: '{{ climate_entity }}'
        data:
          temperature: '{{ min_ac }}'
        action: climate.set_temperature
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
  - data:
      temp_sensor: '{{ temp_sensor }}'
      setpoint: '{{ setpoint }}'
      min_ac: '{{ min_ac }}'
      max_ac: '{{ max_ac }}'
      climate_entity: '{{ climate_entity }}'
    action: script.temp_reglerare_1_steg_1_c
  mode: single
- id: '1769278939105'
  alias: 'AC: På_väg-policy (28+boost tills Kallax ≥20, sen På_väg-reglering)'
  triggers:
  - entity_id: input_select.huslage
    to: På_väg
    id: enter_pa_vag
    trigger: state
  - entity_id: input_number.pa_vag_target
    id: slider
    trigger: state
  - entity_id: sensor.vardagsrum_kallax_temperature
    above: 19.9
    id: reached_threshold
    trigger: numeric_state
  - minutes: /20
    id: tick
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: På_väg
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_pa_vag'' }}'
      sequence: []
    default:
    - condition: state
      entity_id: input_select.huslage_cooldown
      state: Idle
  - variables:
      temp_sensor: sensor.vardagsrum_kallax_temperature
      kallax: '{{ states(temp_sensor) | float }}'
      warmup_threshold: 20
      warmup_temp: 28
      setpoint: '{{ states(''input_number.pa_vag_target'') | float }}'
      min_ac: 16
      max_ac: 28
      climate_entity: climate.sandras_ac
      boost_entity: switch.boost_mode
      ac_mode: '{{ state_attr(climate_entity, ''hvac_mode'') or states(climate_entity)
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_pa_vag'' }}'
      sequence:
      - target:
          entity_id: switch.stugan_cameras
        action: switch.turn_off
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ kallax < warmup_threshold }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ac_mode != ''heat'' }}'
          sequence:
          - target:
              entity_id: '{{ climate_entity }}'
            data:
              hvac_mode: heat
            action: climate.set_hvac_mode
          - delay: 00:00:10
      - target:
          entity_id: '{{ climate_entity }}'
        data:
          temperature: '{{ warmup_temp }}'
        action: climate.set_temperature
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
      - delay: 00:00:02
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(boost_entity, ''off'') }}'
          sequence:
          - target:
              entity_id: '{{ boost_entity }}'
            action: switch.turn_on
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ is_state(boost_entity, ''on'') }}'
        sequence:
        - target:
            entity_id: '{{ boost_entity }}'
          action: switch.turn_off
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ trigger.id == 'reached_threshold'\n   or (trigger.id
            == 'enter_pa_vag' and kallax >= warmup_threshold) }}\n"
        sequence:
        - variables:
            ac_mode_now: '{{ state_attr(climate_entity, ''hvac_mode'') or states(climate_entity)
              }}'
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ ac_mode_now != ''heat'' }}'
            sequence:
            - target:
                entity_id: '{{ climate_entity }}'
              data:
                hvac_mode: heat
              action: climate.set_hvac_mode
            - delay: 00:00:10
        - target:
            entity_id: '{{ climate_entity }}'
          data:
            temperature: '{{ setpoint }}'
          action: climate.set_temperature
        - target:
            entity_id: input_datetime.ac_last_command
          data:
            datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
          action: input_datetime.set_datetime
    - data:
        temp_sensor: '{{ temp_sensor }}'
        setpoint: '{{ setpoint }}'
        min_ac: '{{ min_ac }}'
        max_ac: '{{ max_ac }}'
        climate_entity: '{{ climate_entity }}'
      action: script.temp_reglerare_1_steg_1_c
  mode: single
- id: '1769279262294'
  alias: 'Husläge: Orchestrator (zone.home)'
  triggers:
  - entity_id: zone.home
    above: 0
    for: 00:00:10
    id: to_hemma
    trigger: numeric_state
  - entity_id: zone.home
    below: 1
    for: 00:03:00
    id: to_borta
    trigger: numeric_state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: timer.huslage_cooldown
      state: active
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: to_hemma
      - condition: template
        value_template: '{{ not is_state(''input_select.huslage'', ''Hemma'') }}'
      sequence:
      - target:
          entity_id: input_select.huslage
        data:
          option: Hemma
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: to_borta
      - condition: template
        value_template: '{{ not is_state(''input_select.huslage'', ''Borta'') }}'
      sequence:
      - target:
          entity_id: input_select.huslage
        data:
          option: Borta
        action: input_select.select_option
  mode: single
- id: '1769285161841'
  alias: 'Init: Default temperature targets'
  triggers:
  - event: start
    trigger: homeassistant
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.hemma_borvarde_dag'') in [''unknown'',
          ''unavailable''] }}'
      sequence:
      - data:
          entity_id: input_number.hemma_borvarde_dag
          value: 20
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.hemma_borvarde_natt'') in [''unknown'',
          ''unavailable''] }}'
      sequence:
      - data:
          entity_id: input_number.hemma_borvarde_natt
          value: 16
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.pa_vag_target'') in [''unknown'',
          ''unavailable''] }}'
      sequence:
      - data:
          entity_id: input_number.pa_vag_target
          value: 20
        action: input_number.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.borta_sovrum_target'') in [''unknown'',
          ''unavailable''] }}'
      sequence:
      - data:
          entity_id: input_number.borta_sovrum_target
          value: 8
        action: input_number.set_value
  mode: single
- id: '1769287894757'
  alias: 'UI: Husläge cooldown on change'
