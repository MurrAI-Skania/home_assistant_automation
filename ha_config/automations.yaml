  actions:
  - action: script.turn_off
    target:
      entity_id: script.vardagsrum_mys_loop
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Colorloop
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.vardagsrum_mys_loop
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Gold
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          xy_color:
          - 0.565
          - 0.404
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Red
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 0
          - 0
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Purple
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          xy_color:
          - 0.32
          - 0.125
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Turquoise
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 0
          - 255
          - 255
    - conditions:
      - condition: state
        entity_id: input_select.vardagsrum_led_mysbelysning_cykel
        state: Blue
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          xy_color:
          - 0.136
          - 0.04
  mode: restart
