- id: '1769346463710'
  alias: 'Vardagsrum: In the mood'
  triggers:
  - entity_id: input_boolean.vardagsrum_in_the_mood
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_in_the_mood
        state: 'on'
      sequence:
      - target:
          entity_id: script.vardagsrum_save_led_strip_previous_state
        action: script.turn_on
      - target:
          entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        action: input_boolean.turn_off
      - target:
          entity_id: script.vardagsrum_warning_emotionally_instable_loop
        action: script.turn_off
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 0
          - 0
          transition: 0
        action: light.turn_on
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_in_the_mood
        state: 'off'
      - condition: state
        entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        state: 'off'
      sequence:
      - target:
          entity_id: script.vardagsrum_restore_led_strip_previous_state
        action: script.turn_on
  mode: restart
- id: '1769346508149'
  alias: 'Vardagsrum: Warning emotionally instable'
  triggers:
  - entity_id: input_boolean.vardagsrum_warning_emotionally_instable
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        state: 'on'
      sequence:
      - target:
          entity_id: script.vardagsrum_save_led_strip_previous_state
        action: script.turn_on
      - target:
          entity_id: input_boolean.vardagsrum_in_the_mood
        action: input_boolean.turn_off
      - target:
          entity_id: script.vardagsrum_warning_emotionally_instable_loop
        action: script.turn_on
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        state: 'off'
      sequence:
      - target:
          entity_id: script.vardagsrum_warning_emotionally_instable_loop
        action: script.turn_off
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.vardagsrum_in_the_mood
            state: 'off'
          sequence:
          - target:
              entity_id: script.vardagsrum_restore_led_strip_previous_state
            action: script.turn_on
  mode: restart
