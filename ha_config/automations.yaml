- id: '1768653089192'
  alias: Vardagsrum - Knapp 1 Kort (UPP)
  triggers:
  - event_type: state_changed
    event_data:
      entity_id: event.vardagsrum_knapp_entre_button_1
    trigger: event
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.new_state.attributes.event_type == ''multi_press_1''
      }}'
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.vardagsrum_lampor
        state: 'off'
      sequence:
      - target:
          entity_id: light.vardagsrum_lampor
        data:
          brightness_pct: 20
          color_temp: 454
        action: light.turn_on
    - conditions:
      - condition: state
        entity_id: light.vardagsrum_taklampa
        state: 'off'
      - condition: state
        entity_id: light.vardagsrum_ledstrip_baksida
        state: 'on'
      sequence:
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_step_pct: 20
        action: light.turn_on
    default:
    - target:
        entity_id: light.vardagsrum_lampor
      data:
        brightness_step_pct: 20
      action: light.turn_on
  mode: restart
