mysig_langsam_loop:
  alias: Vardagsrum - Mys Loop
  description: Infinite loop. The Automation kills this when you change color.
  mode: restart
  sequence:
  - repeat:
      count: 99999
      sequence:
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 128
          - 0
          - 128
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 0
          - 0
          - 255
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 0
          - 255
          - 255
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 255
          - 0
          - 0
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 255
          - 140
          - 30
          transition: 5
        action: light.turn_on
      - delay: 5
temp_reglerare_1_steg_1_c:
  alias: 'Temp-reglerare: 1 steg (±1°C)'
  mode: single
  fields:
    temp_sensor:
      description: Temp-sensor som styr
    setpoint:
      description: Börvärde i °C
    min_ac:
      description: Min setpoint på AC
    max_ac:
      description: Max setpoint på AC
    climate_entity:
      description: Vilken climate som styrs
  sequence:
  - variables:
      cooldown_s: 10
      last_str: '{{ states(''input_datetime.ac_last_command'') }}'
      last_ts: "{% if last_str in ['unknown','unavailable','none',''] %}\n  0\n{%
        else %}\n  {{ as_timestamp(last_str) }}\n{% endif %}\n"
      now_ts: '{{ as_timestamp(now()) }}'
      elapsed: '{{ now_ts - last_ts }}'
      wait_s: '{{ [0, (cooldown_s - elapsed) | round(0)] | max | int }}'
  - delay:
      seconds: '{{ wait_s }}'
  - variables:
      t: '{{ states(temp_sensor) | float }}'
      sp: '{{ setpoint | float }}'
      minv: '{{ min_ac | float }}'
      maxv: '{{ max_ac | float }}'
      ac: '{{ climate_entity }}'
      ac_set: '{{ state_attr(ac, ''temperature'') | float }}'
      ac_mode: '{{ state_attr(ac, ''hvac_mode'') or states(ac) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ac_mode != ''heat'' }}'
      sequence:
      - target:
          entity_id: '{{ ac }}'
        data:
          hvac_mode: heat
        action: climate.set_hvac_mode
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
      - delay: 00:00:10
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ t < sp and ac_set < maxv }}'
      sequence:
      - target:
          entity_id: '{{ ac }}'
        data:
          temperature: '{{ ac_set + 1 }}'
        action: climate.set_temperature
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
    - conditions:
      - condition: template
        value_template: '{{ t >= sp and ac_set > minv }}'
      sequence:
      - target:
          entity_id: '{{ ac }}'
        data:
          temperature: '{{ ac_set - 1 }}'
        action: climate.set_temperature
      - target:
          entity_id: input_datetime.ac_last_command
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
        action: input_datetime.set_datetime
vardagsrum_save_led_strip_previous_state:
  alias: 'Vardagsrum: Save LED strip previous state'
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        state: 'off'
      sequence:
      - data:
          scene_id: vardagsrum_ledstrip_prev
          snapshot_entities:
          - light.vardagsrum_ledstrip_baksida
        action: scene.create
      - target:
          entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        action: input_boolean.turn_on
  description: ''
vardagsrum_restore_led_strip_previous_state:
  alias: 'Vardagsrum: Restore LED strip previous state'
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        state: 'on'
      sequence:
      - target:
          entity_id: scene.vardagsrum_ledstrip_prev
        action: scene.turn_on
      - target:
          entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        action: input_boolean.turn_off
  description: ''
vardagsrum_warning_emotionally_instable_loop_2:
  alias: 'Vardagsrum: Warning emotionally instable loop'
  mode: restart
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        state: 'on'
      sequence:
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 0
          - 0
          transition: 0
        action: light.turn_on
      - delay: '00:00:00.5'
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 0
          - 0
          - 255
          transition: 0
        action: light.turn_on
      - delay: '00:00:00.5'
  description: ''
