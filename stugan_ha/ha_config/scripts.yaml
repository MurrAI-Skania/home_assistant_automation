mysig_langsam_loop:
  alias: Vardagsrum - Mys Loop
  description: Infinite loop. The Automation kills this when you change color.
  mode: restart
  sequence:
  - repeat:
      count: 99999
      sequence:
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 128
          - 0
          - 128
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 0
          - 0
          - 255
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 0
          - 255
          - 255
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 255
          - 0
          - 0
          transition: 5
        action: light.turn_on
      - delay: 5
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          rgb_color:
          - 255
          - 140
          - 30
          transition: 5
        action: light.turn_on
      - delay: 5

vardagsrum_save_led_strip_previous_state:
  alias: 'Vardagsrum: Save LED strip previous state'
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        state: 'off'
      sequence:
      - data:
          scene_id: vardagsrum_ledstrip_prev
          snapshot_entities:
          - light.vardagsrum_ledstrip_baksida
        action: scene.create
      - target:
          entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        action: input_boolean.turn_on
  description: ''
vardagsrum_restore_led_strip_previous_state:
  alias: 'Vardagsrum: Restore LED strip previous state'
  mode: single
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        state: 'on'
      sequence:
      - target:
          entity_id: scene.vardagsrum_ledstrip_prev
        action: scene.turn_on
      - target:
          entity_id: input_boolean.vardagsrum_ledstrip_prev_saved
        action: input_boolean.turn_off
  description: ''
vardagsrum_warning_emotionally_instable_loop_2:
  alias: 'Vardagsrum: Warning emotionally instable loop'
  mode: restart
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.vardagsrum_warning_emotionally_instable
        state: 'on'
      sequence:
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 255
          - 0
          - 0
          transition: 0
        action: light.turn_on
      - delay: '00:00:00.5'
      - target:
          entity_id: light.vardagsrum_ledstrip_baksida
        data:
          brightness_pct: 100
          rgb_color:
          - 0
          - 0
          - 255
          transition: 0
        action: light.turn_on
      - delay: '00:00:00.5'
  description: ''
ac_apply_state:
  alias: "AC: Gate (Apply State)"
  mode: queued
  fields:
    climate_entity:
      description: "Entity ID of the AC"
      required: true
    hvac_mode:
      description: "Desired HVAC mode"
      required: false
    temperature:
      description: "Desired temperature"
      required: false
    boost:
      description: "Boost enabled (true/false)"
      required: false
    boost_entity:
      description: "Switch entity for boost"
      required: false
    sleep:
      description: "Sleep enabled (true/false)"
      required: false
    sleep_entity:
      description: "Switch entity for Sleep mode"
      required: false
      default: switch.ac_sleep_mode
    screen_display_entity:
      description: "Switch entity for the AC Screen Display"
      required: false
      default: switch.sandras_ac_screen_display
    fan_speed:
      description: "Desired fan speed (0-100)"
      required: false
    fan_entity:
      description: "Number entity for AC fan speed"
      required: false
      default: number.sandras_ac_fan_speed
  sequence:
    # 1. Load last state
    - variables:
        last_state_json: "{{ states('input_text.ac_last_state_json') }}"
        last_state: >
          {% if last_state_json in ['unknown', 'unavailable', '', 'None'] %}
            {}
          {% else %}
            {{ last_state_json | from_json }}
          {% endif %}
        
        # Merge new fields into desired state
        desired_hvac_mode: "{{ hvac_mode if hvac_mode is defined and hvac_mode is not none else last_state.get('hvac_mode') }}"
        desired_temperature: "{{ temperature if temperature is defined and temperature is not none else last_state.get('temperature') }}"
        desired_boost: "{{ boost if boost is defined and boost is not none else last_state.get('boost') }}"
        desired_sleep: "{{ sleep if sleep is defined and sleep is not none else last_state.get('sleep') }}"
        desired_fan: "{{ fan_speed if fan_speed is defined and fan_speed is not none else last_state.get('fan_speed') }}"
        
        # Check what actually changed (Compare against REAL device state)
        change_hvac: "{{ desired_hvac_mode is not none and desired_hvac_mode != states(climate_entity) }}"
        change_temp: "{{ desired_temperature is not none and desired_temperature | float != state_attr(climate_entity, 'temperature') | float(desired_temperature | float) }}"
        change_boost: "{{ desired_boost is not none and boost_entity is defined and boost_entity is not none and (desired_boost != is_state(boost_entity, 'on')) }}"
        change_sleep: "{{ desired_sleep is not none and sleep_entity is defined and sleep_entity is not none and (desired_sleep != is_state(sleep_entity, 'on')) }}"
        change_fan: "{{ desired_fan is not none and fan_entity is defined and fan_entity is not none and (desired_fan | int != states(fan_entity) | int) }}"
        
        # Should we act?
        should_act: "{{ change_hvac or change_temp or change_boost or change_sleep or change_fan }}"

    # 2. Dedupe
    - if:
        - condition: template
          value_template: "{{ not should_act }}"
      then:
        - stop: "No changes detected (Deduped)"

    # Log the intent (only if changes detected)
    - service: logbook.log
      data:
        name: "AC Gate"
        message: >-
          Applying:
          {% if change_hvac %}Mode: {{ desired_hvac_mode }} {% endif %}
          {% if change_temp %}Temp: {{ desired_temperature }}°C {% endif %}
          {% if change_boost %}Boost: {{ desired_boost }} {% endif %}
          {% if change_sleep %}Sleep: {{ desired_sleep }} {% endif %}
          {% if change_fan %}Fan: {{ desired_fan }}%{% endif %}
        entity_id: "{{ climate_entity }}"

    # 3. Wait for cooldown (if active)
    - wait_template: "{{ is_state('timer.ac_command_cooldown', 'idle') }}"
      timeout: "00:01:00"
      continue_on_timeout: true

    # 4. Execute - HVAC Mode (Wait 3s)
    - if:
        - condition: template
          value_template: "{{ change_hvac and desired_hvac_mode is not none }}"
      then:
        - service: climate.set_hvac_mode
          target:
            entity_id: "{{ climate_entity }}"
          data:
            hvac_mode: "{{ desired_hvac_mode }}"
        - service: timer.start
          target:
            entity_id: timer.ac_command_cooldown
        - delay: "00:00:03"

    # 5. Execute - Temperature (Wait 5s)
    - if:
        - condition: template
          value_template: "{{ change_temp and desired_temperature is not none }}"
      then:
        - service: climate.set_temperature
          target:
            entity_id: "{{ climate_entity }}"
          data:
            temperature: "{{ desired_temperature }}"
        - service: timer.start
          target:
            entity_id: timer.ac_command_cooldown
        - delay: "00:00:05"
    
    # 6. Execute - Boost (Wait 5s)
    - if:
        - condition: template
          value_template: "{{ change_boost and boost_entity is defined and boost_entity is not none }}"
      then:
        - service: >
            {% if desired_boost %} switch.turn_on {% else %} switch.turn_off {% endif %}
          target:
            entity_id: "{{ boost_entity }}"
        - service: timer.start
          target:
            entity_id: timer.ac_command_cooldown
        - delay: "00:00:05"

    # 7. Execute - Sleep
    - if:
        - condition: template
          value_template: "{{ change_sleep and sleep_entity is defined and sleep_entity is not none }}"
      then:
        - delay: "00:00:02"
        - service: >
            {% if desired_sleep %} switch.turn_on {% else %} switch.turn_off {% endif %}
          target:
            entity_id: "{{ sleep_entity }}"
        - service: timer.start
          target:
            entity_id: timer.ac_command_cooldown
        - delay: "00:00:02"

    # 8. Execute - Fan Speed
    - if:
        - condition: template
          value_template: "{{ change_fan and fan_entity is defined and fan_entity is not none }}"
      then:
        - service: number.set_value
          target:
            entity_id: "{{ fan_entity }}"
          data:
            value: "{{ desired_fan }}"
        - service: timer.start
          target:
            entity_id: timer.ac_command_cooldown

    # 9. Turn Off Screen Display (Always, if we touched anything)
    - if:
        - condition: template
          value_template: "{{ screen_display_entity is defined and screen_display_entity is not none }}"
      then:
        - service: switch.turn_off
          target:
            entity_id: "{{ screen_display_entity }}"

    # 10. Update Last State
    - service: input_text.set_value
      target:
        entity_id: input_text.ac_last_state_json
      data:
        value: >
          {{ 
            {
              'hvac_mode': desired_hvac_mode,
              'temperature': desired_temperature,
              'boost': desired_boost,
              'sleep': desired_sleep,
              'fan_speed': desired_fan
            } | to_json
          }}

temp_reglerare_1_steg_1_c_via_gate:
  alias: 'Temp-reglerare (Via Gate)'
  mode: single
  fields:
    temp_sensor:
      description: Temp-sensor som styr
    setpoint:
      description: Börvärde i °C
    min_ac:
      description: Min setpoint på AC
    max_ac:
      description: Max setpoint på AC
    climate_entity:
      description: Vilken climate som styrs
  sequence:
  - variables:
      t: "{{ states(temp_sensor) | float(0) }}"
      sp: "{{ setpoint | float(20) }}"
      minv: "{{ min_ac | float(16) }}"
      maxv: "{{ max_ac | float(30) }}"
      ac: "{{ climate_entity }}"
      
      # Read current AC temp from state attribute
      ac_set_raw: "{{ state_attr(ac, 'temperature') }}"
      ac_set: "{{ ac_set_raw | float(sp) }}"
      
      # Logic: P-controller (Proportional Offset)
      delta: "{{ sp - t }}"
      
      # Check if Smart Regulation is enabled
      smart_mode: "{{ states('input_boolean.ac_smart_regulation') | bool(true) }}"

      # Adjustment: Rounded delta if Smart Mode is ON, otherwise 0
      # With Deadband of 0.5°C to prevent micro-hunting
      adjustment: >
        {% if smart_mode and (delta | abs) >= 0.5 %}
          {{ delta | round(0, 'common') | int }}
        {% else %}
          0
        {% endif %}
      
      # Next Temperature: Target + Adjustment
      next_temp_raw: "{{ sp + adjustment }}"
      
      # Clamp next_temp to device limits
      next_temp: "{{ [minv, [next_temp_raw, maxv] | min] | max }}"

  # Log decision if requesting a change
  - if:
      - condition: template
        value_template: "{{ next_temp != ac_set }}"
    then:
      - service: logbook.log
        data:
          name: "Smart Regulator"
          message: "Room: {{ t }}°C | Target: {{ sp }}°C | Adj: {{ adjustment }} | New AC Set: {{ next_temp }}°C"
          entity_id: "{{ ac }}"

  # Call gate with new temp AND ensure ECO is ON during regulation
  # Only call if we actually need to change Temp, Mode, or Boost.
  # This prevents spamming "Eco On" when the system is otherwise stable.
  - if:
      - condition: template
        value_template: "{{ next_temp != ac_set or states(ac) != 'heat' or is_state('switch.boost_mode', 'on') }}"
    then:
      - service: script.ac_apply_state
        data:
          climate_entity: "{{ ac }}"
          temperature: "{{ next_temp }}"
          hvac_mode: heat
          boost: false
          boost_entity: switch.boost_mode