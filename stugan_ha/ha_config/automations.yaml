- id: '1769278502631'
  alias: 'AC: Hemma-policy (day/night) + privacy'
  triggers:
  - minutes: /10
    id: tick
    trigger: time_pattern
  - entity_id: input_select.huslage
    to: Hemma
    id: enter_hemma
    trigger: state
  - at: 06:15:00
    id: boundary_day
    trigger: time
  - at: '20:00:00'
    id: boundary_night
    trigger: time
  - at: '22:00:00'
    id: boundary_weekend_night
    trigger: time
  - entity_id: sensor.vardagsrum_kallax_temperature
    id: temp_change
    trigger: state
    for: "00:00:30"
  - event: start
    id: startup
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: Hemma
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''enter_hemma'',''boundary_day'',''boundary_night'',''boundary_weekend_night'']
          }}'
      sequence: []
    default:
    - condition: state
      entity_id: timer.huslage_cooldown
      state: idle
  - variables:
      wd: '{{ now().weekday() }}'
      t: '{{ now().strftime(''%H:%M:%S'') }}'
      is_weekend: '{{ wd in [4,5] }}'
      is_day: >
        {% if is_weekend %}
          {{ '06:15:00' <= t < '22:00:00' }}
        {% else %}
          {{ '06:15:00' <= t < '20:00:00' }}
        {% endif %}
      setpoint: "{% if is_day %}
  {{ states('input_number.hemma_borvarde_dag') |
    float }}
{% else %}
  {{ states('input_number.hemma_borvarde_natt') | float
    }}
{% endif %}"
      temp_sensor: sensor.vardagsrum_kallax_temperature
      current_temp: '{{ states(temp_sensor) | float }}'
      min_ac: 16
      max_ac: 28
      
      # Boost Logic with Hysteresis
      last_state_json: "{{ states('input_text.ac_last_state_json') }}"
      last_state: >
        {% if last_state_json in ['unknown', 'unavailable', '', 'None'] %}
          {}
        {% else %}
          {{ last_state_json | from_json }}
        {% endif %}
      is_boost_on: "{{ last_state.get('boost', false) }}"
      
      # If quiet tick AND boost is off: Threshold = Target - 5
      # Otherwise (Manual/Arrival/Boost active): Threshold = Target
      boost_threshold: >
        {% if trigger and trigger.id in ['tick', 'temp_change', 'startup'] and not is_boost_on %}
          {{ setpoint - 5 }}
        {% else %}
          {{ setpoint }}
        {% endif %}
      
      boost_setpoint: '{{ [setpoint + 5, max_ac] | min }}'
      climate_entity: climate.sandras_ac
      boost_entity: switch.boost_mode
      eco_entity: switch.ac_eco_mode
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_hemma'' }}'
      sequence:
      - target:
          entity_id: input_boolean.camera_privacy
        action: input_boolean.turn_on
  - choose:
    # Scenario 1: Below Threshold -> Boost Mode
    - conditions:
      - condition: template
        value_template: '{{ current_temp < (boost_threshold | float) }}'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ boost_setpoint }}'
          boost: true
          boost_entity: '{{ boost_entity }}'
          eco: false
          eco_entity: '{{ eco_entity }}'
    
    # Scenario 2: Target Reached -> Normal Regulation
    default:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ setpoint }}'
          boost: false
          boost_entity: '{{ boost_entity }}'
          eco: true
          eco_entity: '{{ eco_entity }}'
      - data:
          temp_sensor: '{{ temp_sensor }}'
          setpoint: '{{ setpoint }}'
          min_ac: '{{ min_ac }}'
          max_ac: '{{ max_ac }}'
          climate_entity: '{{ climate_entity }}'
          eco_entity: '{{ eco_entity }}'
        action: script.temp_reglerare_1_steg_1_c_via_gate
  mode: single

- id: '1769278860222'
  alias: 'AC: Borta-policy (sovrum) + privacy off'
  triggers:
  - entity_id: input_select.huslage
    to: Borta
    id: enter_borta
    trigger: state
  - minutes: /10
    id: tick
    trigger: time_pattern
  - event: start
    id: startup
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: Borta
  - condition: state
    entity_id: timer.huslage_cooldown
    state: idle
  actions:
  - variables:
      temp_sensor: sensor.sovrum_temperatur
      setpoint: '{{ states(''input_number.borta_sovrum_target'') | float }}'
      min_ac: 16
      max_ac: 20
      climate_entity: climate.sandras_ac
      eco_entity: switch.ac_eco_mode
  - target:
      entity_id: input_boolean.camera_privacy
    action: input_boolean.turn_off
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_borta'' }}'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ min_ac }}'
          boost: false
          boost_entity: switch.boost_mode
          eco: true
          eco_entity: '{{ eco_entity }}'
    default:
    - data:
        temp_sensor: '{{ temp_sensor }}'
        setpoint: '{{ setpoint }}'
        min_ac: '{{ min_ac }}'
        max_ac: '{{ max_ac }}'
        climate_entity: '{{ climate_entity }}'
        eco_entity: '{{ eco_entity }}'
        eco: true
      action: script.temp_reglerare_1_steg_1_c_via_gate
- id: '1769278939105'
  alias: 'AC: På_väg-policy (28+boost tills Kallax ≥20, sen På_väg-reglering)'
  triggers:
  - entity_id: input_select.huslage
    to: På_väg
    id: enter_pa_vag
    trigger: state
  - platform: template
    value_template: "{{ states('sensor.vardagsrum_kallax_temperature')|float >= states('input_number.pa_vag_target')|float }}"
    id: reached_threshold
  - minutes: /10
    id: tick
    trigger: time_pattern
  - event: start
    id: startup
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: På_väg
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_pa_vag'' }}'
      sequence: []
    default:
    - condition: state
      entity_id: timer.huslage_cooldown
      state: idle
  - variables:
      temp_sensor: sensor.vardagsrum_kallax_temperature
      current_temp: '{{ states(temp_sensor) | float }}'
      setpoint: '{{ states(''input_number.pa_vag_target'') | float }}'
      min_ac: 16
      max_ac: 28
      
      # Boost Logic with Hysteresis
      last_state_json: "{{ states('input_text.ac_last_state_json') }}"
      last_state: >
        {% if last_state_json in ['unknown', 'unavailable', '', 'None'] %}
          {}
        {% else %}
          {{ last_state_json | from_json }}
        {% endif %}
      is_boost_on: "{{ last_state.get('boost', false) }}"
      
      # If quiet tick AND boost is off: Threshold = Target - 5
      # Otherwise (Manual/Arrival/Boost active): Threshold = Target
      boost_threshold: >
        {% if trigger and trigger.id in ['tick', 'startup'] and not is_boost_on %}
          {{ setpoint - 5 }}
        {% else %}
          {{ setpoint }}
        {% endif %}
      
      boost_setpoint: '{{ [setpoint + 5, max_ac] | min }}'
      climate_entity: climate.sandras_ac
      boost_entity: switch.boost_mode
      eco_entity: switch.ac_eco_mode
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_pa_vag'' }}'
      sequence:
      - target:
          entity_id: input_boolean.camera_privacy
        action: input_boolean.turn_off
  - choose:
    # Scenario 1: Below Threshold -> Boost Mode
    - conditions:
      - condition: template
        value_template: '{{ current_temp < (boost_threshold | float) }}'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ boost_setpoint }}'
          boost: true
          boost_entity: '{{ boost_entity }}'
          eco: false
          eco_entity: '{{ eco_entity }}'
    
    # Scenario 2: Target Reached -> Normal Regulation
    default:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ setpoint }}'
          boost: false
          boost_entity: '{{ boost_entity }}'
          eco: true
          eco_entity: '{{ eco_entity }}'
      - data:
          temp_sensor: '{{ temp_sensor }}'
          setpoint: '{{ setpoint }}'
          min_ac: '{{ min_ac }}'
          max_ac: '{{ max_ac }}'
          climate_entity: '{{ climate_entity }}'
          eco_entity: '{{ eco_entity }}'
        action: script.temp_reglerare_1_steg_1_c_via_gate
  mode: single
- id: '1769279262294'
  alias: 'Husläge: Orchestrator (zone.home)'
  triggers:
  - entity_id: zone.home
    above: 0
    for: 00:00:10
    id: to_hemma
    trigger: numeric_state
  - entity_id: zone.home
    below: 1
    for: 00:03:00
    id: to_borta
    trigger: numeric_state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: timer.huslage_cooldown
      state: active
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: to_hemma
      - condition: template
        value_template: '{{ not is_state(''input_select.huslage'', ''Hemma'') }}'
      sequence:
      - target:
          entity_id: input_select.huslage
        data:
          option: Hemma
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id: to_borta
      - condition: template
        value_template: '{{ not is_state(''input_select.huslage'', ''Borta'') }}'
      sequence:
      - target:
          entity_id: input_select.huslage
        data:
          option: Borta
        action: input_select.select_option
  mode: single
