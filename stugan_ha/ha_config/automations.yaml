  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: Borta
  - condition: state
    entity_id: timer.huslage_cooldown
    state: idle
  # Ignore Tick trigger if change is small (Heartbeat/Noise filter)
  - condition: template
    value_template: >
      {{ trigger.id != 'tick' or 
         (trigger.from_state is defined and trigger.from_state is not none and 
          (trigger.to_state.state|float(0) - trigger.from_state.state|float(0))|abs >= 0.5) }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.frost_guard_active
        state: 'on'
      sequence:
      - stop: "Frost Guard Active - Normal Policy Disabled"

  # 2. Heating Guard
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.heating_enabled
        state: 'off'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: climate.sandras_ac
          hvac_mode: 'off'
          boost: false
          boost_entity: switch.boost_mode
      - stop: "Heating Disabled by Global Guard"

  - variables:
      temp_sensor: sensor.indoor_min_temperature
      current_temp: "{{ states(temp_sensor) | float }}"
      setpoint: "{{ states('input_number.borta_sovrum_target') | float }}"
      min_ac: 16
      max_ac: 28
      climate_entity: climate.sandras_ac
      boost_entity: switch.boost_mode
      sleep_entity: switch.ac_sleep_mode

  # 3. AC Logic (Borta)
  # Ensure Sleep is OFF
  - if:
      - condition: state
        entity_id: switch.ac_sleep_mode
        state: 'on'
    then:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          sleep: false
          sleep_entity: '{{ sleep_entity }}'

  # Regulate Temperature (Protocol)
  - data:
      temp_sensor: '{{ temp_sensor }}'
      setpoint: '{{ setpoint }}'
      min_ac: '{{ min_ac }}'
      max_ac: '{{ max_ac }}'
      climate_entity: '{{ climate_entity }}'
    action: script.temp_reglerare_1_steg_1_c_via_gate
- id: '1769278939105'
  alias: 'AC: På_väg-policy (28+boost tills Kallax ≥20, sen På_väg-reglering)'
  triggers:
  - entity_id: input_select.huslage
    to: På_väg
    id: enter_pa_vag
    trigger: state
  - platform: template
    value_template: "{{ states('sensor.vardagsrum_kallax_temperature')|float >= states('input_number.pa_vag_target')|float }}"
    id: reached_threshold
  - platform: state
    entity_id: sensor.vardagsrum_kallax_temperature
    id: tick
  - event: start
    id: startup
    trigger: homeassistant
  - entity_id: input_boolean.heating_enabled
    to: 'on'
    id: heating_resume
    trigger: state
  conditions:
  - condition: state
    entity_id: input_select.huslage
    state: På_väg
  # Ignore Tick trigger if change is small (Heartbeat/Noise filter)
  - condition: template
    value_template: >
      {{ trigger.id != 'tick' or 
         (trigger.from_state is defined and trigger.from_state is not none and 
          (trigger.to_state.state|float(0) - trigger.from_state.state|float(0))|abs >= 0.5) }}
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.frost_guard_active
        state: 'on'
      sequence:
      - stop: "Frost Guard Active - Normal Policy Disabled"
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.heating_enabled
        state: 'off'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: climate.sandras_ac
          hvac_mode: 'off'
          boost: false
          boost_entity: switch.boost_mode
      - stop: "Heating Disabled by Global Guard"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''enter_pa_vag'' }}'
      sequence: []
    default:
    - condition: state
      entity_id: input_select.huslage_cooldown
      state: Idle
  - variables:
      temp_sensor: sensor.vardagsrum_kallax_temperature
      current_temp: '{{ states(temp_sensor) | float }}'
      setpoint: '{{ states(''input_number.pa_vag_target'') | float }}'
      min_ac: 16
      max_ac: 28
      
      # Boost Logic with Hysteresis
      last_state_json: "{{ states('input_text.ac_last_state_json') }}"
      last_state: >
        {% if last_state_json in ['unknown', 'unavailable', '', 'None'] %}
          {}
        {% else %}
          {{ last_state_json | from_json }}
        {% endif %}
      is_boost_on: "{{ last_state.get('boost', false) }}"
      
      # If quiet tick AND boost is off: Threshold = Target - 5
      # Otherwise (Manual/Arrival/Boost active): Threshold = Target
      boost_threshold: >
        {% if trigger and trigger.id in ['tick', 'startup', 'heating_resume'] %}
          {% if is_boost_on %}
            {{ setpoint - 0.5 }}
          {% else %}
            {{ setpoint - 3.0 }}
          {% endif %}
        {% else %}
          {{ setpoint }}
        {% endif %}
      
      boost_setpoint: '{{ [setpoint + 5, max_ac] | min }}'
      climate_entity: climate.sandras_ac
      boost_entity: switch.boost_mode
      sleep_entity: switch.ac_sleep_mode
  - choose:
    # Scenario 1: Below Threshold -> Boost Mode
    - conditions:
      - condition: template
        value_template: '{{ current_temp < (boost_threshold | float) }}'
      sequence:
      - service: script.ac_apply_state
        data:
          climate_entity: '{{ climate_entity }}'
          hvac_mode: heat
          temperature: '{{ [setpoint + 6, 28] | min }}'
          boost: true
          boost_entity: '{{ boost_entity }}'
          sleep: false
          sleep_entity: '{{ sleep_entity }}'
          fan_speed: 100
    
    # Scenario 2: Target Reached -> Normal Regulation
    default:
      - data:
          temp_sensor: '{{ temp_sensor }}'
          setpoint: '{{ setpoint }}'
          min_ac: '{{ min_ac }}'
          max_ac: '{{ max_ac }}'
          climate_entity: '{{ climate_entity }}'
        action: script.temp_reglerare_1_steg_1_c_via_gate
  mode: single
