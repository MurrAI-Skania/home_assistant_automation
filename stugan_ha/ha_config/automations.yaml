- id: '1769350000001'
  alias: 'System: Outdoor Temp Cutoff'
  description: 'Global Heating Guard based on Outdoor Temperature.'
  triggers:
  - platform: numeric_state
    entity_id: sensor.ac_outdoor_temperature
    above: 10.5
    for: "00:30:00"
  - platform: numeric_state
    entity_id: sensor.ac_outdoor_temperature
    below: 9.5
    for: "00:30:00"
  - platform: state
    entity_id: sensor.ac_outdoor_temperature
    to: 
      - "unavailable"
      - "unknown"
    for: "00:01:00"
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    # Sensor Invalid -> Fail Safe: Enable Heating
    - conditions:
      - condition: or
        conditions:
          - condition: state
            entity_id: sensor.ac_outdoor_temperature
            state: "unavailable"
          - condition: state
            entity_id: sensor.ac_outdoor_temperature
            state: "unknown"
    # Also handle startup where state might be unknown
    # or just simple logic:
      sequence:
      - target:
          entity_id: input_boolean.heating_enabled
        action: input_boolean.turn_on
    # Too warm -> Heating Disabled
    - conditions:
      - condition: numeric_state
        entity_id: sensor.ac_outdoor_temperature
        above: 10.5
      sequence:
      - target:
          entity_id: input_boolean.heating_enabled
        action: input_boolean.turn_off
    # Cold enough -> Heating Enabled
    - conditions:
      - condition: numeric_state
        entity_id: sensor.ac_outdoor_temperature
        below: 9.5
      sequence:
      - target:
          entity_id: input_boolean.heating_enabled
        action: input_boolean.turn_on
  mode: restart

- id: '1769350000002'
  alias: 'AC: Frost Guard (Global)'
  description: 'Emergency heating if any room drops below 8.0°C'
  mode: single
  triggers:
  - platform: numeric_state
    entity_id: sensor.indoor_min_temperature
    below: 8.0
    id: too_cold
    for: "00:10:00"
  - platform: state
    entity_id: sensor.indoor_min_temperature
    id: tick
  - event: start
    id: startup
    trigger: homeassistant
  conditions: []
  actions:
  - variables:
      min_temp: "{{ states('sensor.indoor_min_temperature') | float(none) }}"
      frost_target: 8.0
      release: 9.0
  - choose:
    # Activate Frost Guard
    - conditions:
      - condition: template
        value_template: "{{ min_temp is not none and min_temp <= frost_target }}"
      sequence:
      - target:
          entity_id: input_boolean.frost_guard_active
        action: input_boolean.turn_on
      - service: script.ac_apply_state
        data:
          climate_entity: climate.sandras_ac
          hvac_mode: heat
          temperature: "{{ frost_target }}"
          boost: false
          boost_entity: switch.boost_mode
          sleep: false
          sleep_entity: switch.ac_sleep_mode
    # Deactivate Frost Guard
    - conditions:
      - condition: state
        entity_id: input_boolean.frost_guard_active
        state: "on"
      - condition: template
        value_template: "{{ min_temp is not none and min_temp >= release }}"
      sequence:
      - target:
          entity_id: input_boolean.frost_guard_active
        action: input_boolean.turn_off
- id: '1769600000001'
  alias: 'Murres Rum - TV Mode'
  description: 'Dims lights when TV starts (or recovers), restores when TV stops (or drops).'
  mode: restart
  triggers:
  - platform: state
    entity_id: media_player.xiaomi_tv_box
    from:
    - 'off'
    - 'unavailable'
    - 'unknown'
    - 'standby'
    to:
    - 'on'
    - 'idle'
    - 'playing'
    id: 'tv_on'
  - platform: state
    entity_id: media_player.xiaomi_tv_box
    from:
    - 'on'
    - 'idle'
    - 'playing'
    to:
    - 'off'
    - 'unavailable'
    - 'unknown'
    - 'standby'
    id: 'tv_off'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: 'tv_on'
      sequence:
      - action: scene.create
        data:
          scene_id: murres_lights_before_cinema
          snapshot_entities:
          - light.murres_soff_lampa
          - light.murres_tv_lampa
          - light.murres_golvlampa_skrivbord
      - action: light.turn_off
        target:
          entity_id:
          - light.murres_tv_lampa
          - light.murres_golvlampa_skrivbord
      - action: light.turn_on
        target:
          entity_id: light.murres_soff_lampa
        data:
          brightness_pct: 10
          color_temp: 500
          transition: 3
    - conditions:
      - condition: trigger
        id: 'tv_off'
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.murres_lights_before_cinema
        data:
          transition: 3
- id: 'camera_orchestrator_zone_presence'
  alias: 'Cameras: Orchestrator (Presence)'
  description: 'Toggles privacy mode based on physical presence (Small Zone). Has debounce for GPS jitter.'
  triggers:
  - entity_id: binary_sensor.zone_small_presence
    from: 'off'
    to: 'on'
    for: "00:00:10"
    id: arrived
    trigger: state
  - entity_id: binary_sensor.zone_small_presence
    from: 'on'
    to: 'off'
    for: "00:03:00"
    id: left
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: arrived
      sequence:
      - target:
          entity_id: input_boolean.camera_privacy
        action: input_boolean.turn_on
    - conditions:
      - condition: trigger
        id: left
      sequence:
      - target:
          entity_id: input_boolean.camera_privacy
        action: input_boolean.turn_off
  mode: single
